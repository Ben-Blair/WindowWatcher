; WindowWatcher radar firmware: reads the HLK-LD2450 and prints simple text lines over USB
; for the Java app on the Raspberry Pi. No WiFi, so it runs cool enough to stay on 24/7.
;
; Flash:   pio run -t upload
; Watch:   pio device monitor

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
