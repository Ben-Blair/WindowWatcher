# Where readings come from: "simulated" (no hardware needed) or "serial" (the ESP32 over USB)
sensor.source=simulated

# Serial port of the ESP32. On the Raspberry Pi it's usually /dev/ttyUSB0 or /dev/ttyACM0.
# On a Mac it looks like /dev/cu.usbserial-0001
serial.port=/dev/ttyUSB0
serial.baudRate=115200

# How many fake people the simulated sensor sends past the window
simulated.walks=4

# Local file where every crossing is saved
csv.file=events.csv

# Set to false if the directions come out backwards (depends on how the sensor is mounted)
direction.positiveXMeansTowardComplex=true

# Someone has to move at least this far sideways (mm) for us to tell which way they went
detection.minMovementMm=500

# Detections shorter than this (ms) are treated as sensor noise and ignored
detection.minCrossingMillis=500
